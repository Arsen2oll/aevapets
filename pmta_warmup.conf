# PMTA warm-up ramp for a NEW sending IP relaying through M365 (zabo.com)
#
# Context: EOP steady-state ceiling is ~2,544 recipients/window per IPv4.
# New IPs start lower (~1,500) and earn their way up over ~10 days.
#
# Strategy: start conservative, hold ~24h at each tier, step up only if
# the previous day shipped cleanly (zero 451 4.7.500 in accounting log).
# If you see any 451, DROP BACK one tier and hold another 24h.
#
# How to apply: PMTA re-reads config on `pmta reload`.
# Edit the <domain> entry's max-msg-rate daily per the schedule below.
#
#   Day   max-msg-rate   daily cap (approx)
#   ----- -------------- -----------------------
#   1      300/h          ~7,200   (safe burn-in)
#   2      500/h          ~12,000
#   3      750/h          ~18,000
#   4     1000/h          ~24,000
#   5     1250/h          ~30,000
#   6     1500/h          ~36,000
#   7     1800/h          ~43,200
#   8     2000/h          ~48,000
#   9     2200/h          ~52,800
#   10+   2400/h          ~57,600   (steady state; stays under ~2544/window)
#
# Rules while warming:
#   - Keep max-smtp-out LOW (20). Connection bursts trigger throttle
#     independently of recipient rate.
#   - retry-after 15m: respect 451s; do not pound the connector.
#   - Pace evenly across the hour; don't dump the day's quota in 10 min.
#   - Monitor /var/log/pmta/acct-*.csv for `AS2162` daily (see
#     measure_throttle_window.py). First 451 = STOP ramp, hold or drop.

<domain *>
    # Replace max-msg-rate per the ramp table above
    max-msg-rate 300/h          # DAY 1 — change daily

    max-smtp-out 20
    max-rcpt-per-message 100
    retry-after 15m

    smtp-hosts lookup-mx:zabo.com
    smtp-client-certificate /etc/pmta/zabo.com.pem
    use-starttls yes

    log-transfer-failures yes
    log-connections yes
</domain>
